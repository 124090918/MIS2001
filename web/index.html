<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>销售数据看板</title>

  <!-- React + JSX, bundled locally so no build step and no internet is required -->
  <script src="/web/vendor/react.js"></script>
  <script src="/web/vendor/react-dom.js"></script>
  <script src="/web/vendor/babel.js"></script>

  <style>
    :root {
      --bg: #0b1120;
      --card: #141c30;
      --card-2: #1b2540;
      --line: rgba(255, 255, 255, .08);
      --text: #e6ebf5;
      --muted: #8b9ab5;
      --indigo: #6366f1;
      --violet: #a855f7;
      --teal: #2dd4bf;
      --amber: #fbbf24;
      --rose: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 24px 56px;
      background:
        radial-gradient(1000px 500px at 12% -8%, rgba(99, 102, 241, .22), transparent 60%),
        radial-gradient(900px 500px at 95% 0%, rgba(45, 212, 191, .14), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      min-height: 100vh;
    }

    .wrap { max-width: 1180px; margin: 0 auto; }

    /* ---------- header ---------- */
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
    .head h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.4px; }
    .head p { margin: 0; color: var(--muted); font-size: 14px; }
    .badge {
      padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
      color: var(--teal); background: rgba(45, 212, 191, .12); border: 1px solid rgba(45, 212, 191, .3);
    }

    /* ---------- cards ---------- */
    .card {
      background: linear-gradient(160deg, var(--card-2), var(--card));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .28);
    }
    .card h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
    .card .sub { margin: 0 0 18px; font-size: 12.5px; color: var(--muted); }

    /* ---------- KPI row ---------- */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 18px; }
    .kpi span { display: block; font-size: 12.5px; color: var(--muted); letter-spacing: .5px; }
    .kpi strong { display: block; margin-top: 8px; font-size: 27px; letter-spacing: -.6px; }
    .kpi i { font-style: normal; font-size: 12.5px; color: var(--teal); }

    /* ---------- layout ---------- */
    .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; margin-top: 18px; }
    .span { grid-column: 1 / -1; }
    @media (max-width: 880px) { .kpis, .grid { grid-template-columns: 1fr; } }

    /* ---------- vertical bar chart ---------- */
    .bars { display: flex; align-items: flex-end; gap: 8px; height: 240px; }
    .bars__col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; cursor: default; }
    .bars__tip { height: 20px; font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .bars__col.is-active .bars__tip { color: var(--text); }
    .bars__track { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
    .bars__bar {
      width: 68%; min-height: 4px; border-radius: 7px 7px 3px 3px;
      background: linear-gradient(180deg, var(--violet), var(--indigo));
      transition: filter .15s, transform .15s;
    }
    .bars__col.is-active .bars__bar { filter: brightness(1.25); transform: scaleX(1.06); }
    .bars__label { height: 20px; font-size: 11.5px; color: var(--muted); }

    /* ---------- horizontal rank bars ---------- */
    .rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 15px; }
    .rank__head { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 7px; }
    .rank__label { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank__sub { color: var(--muted); font-size: 11.5px; }
    .rank__value { color: var(--muted); font-variant-numeric: tabular-nums; }
    .rank__track { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, .07); overflow: hidden; }
    .rank__bar { height: 100%; border-radius: 999px; transition: width .5s ease; }

    /* ---------- donut ---------- */
    .donut { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
    .donut__chart { position: relative; width: 150px; height: 150px; flex: none; }
    .donut__chart svg { width: 100%; height: 100%; }
    .donut__center {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .donut__center strong { font-size: 20px; }
    .donut__center span { font-size: 11px; color: var(--muted); }
    .legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
    .legend li { display: flex; align-items: center; gap: 9px; }
    .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    .legend b { margin-left: auto; font-variant-numeric: tabular-nums; }

    /* ---------- misc ---------- */
    .stack { display: flex; flex-direction: column; gap: 18px; }
    .state { text-align: center; padding: 90px 0; color: var(--muted); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react" src="/web/app.jsx"></script>
</body>
</html>
